name: Hallows deployment and bootstrap

on:
  pull_request:
    paths:
      - hallows/**
      - docker-compose.hallows.yml
      - pnpm-lock.yaml
      - packages/shared/**
      - .github/workflows/hallows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - run: pnpm install --frozen-lockfile
      - run: node --import ./cli/node_modules/tsx/dist/loader.mjs --test hallows/dinnerswipe/*.test.mjs
      - run: node --test hallows/deployment.test.mjs
      - run: pnpm --filter @paperclipai/ui build
