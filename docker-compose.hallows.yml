services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_DB: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a hex database password}
    volumes:
      - hallows-pgdata:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U paperclip -d paperclip]
      interval: 5s
      timeout: 5s
      retries: 30

  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:stable}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set the Tailscale auth key}
      TS_HOSTNAME: ${TS_HOSTNAME:-hg-marketing}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - hallows-tailscale-state:/var/lib/tailscale
      - /config:/config:ro
    networks: [egress, database]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9002/healthz]
      interval: 10s
      timeout: 5s
      retries: 30

  server:
    # Built and smoke-tested by the Hallows Docker workflow at commit 0008b6020.
    # Pin the multi-platform manifest; Coolify only pulls, never compiles.
    image: ${PAPERCLIP_IMAGE:-ghcr.io/hallowsgroup/marketing-agency@sha256:7a549c11baa31e57d1c05d8faf6df14fedde3ccd4a2c39ac4d3a9fb2378330ca}
    pull_policy: always
    restart: unless-stopped
    pids_limit: 2048
    network_mode: service:tailscale
    environment:
      DATABASE_URL: postgres://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip
      HOST: 127.0.0.1
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:?Set the HTTPS tailnet URL}
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: ${PAPERCLIP_PUBLIC_URL}
      PAPERCLIP_AUTH_BASE_URL_MODE: explicit
      PAPERCLIP_API_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set the session secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - hallows-paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy
      tailscale:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20

volumes:
  hallows-pgdata:
  hallows-paperclip-data:
  hallows-tailscale-state:

networks:
  database:
    internal: true
  egress:
    driver: bridge
